name: Multi-Environment Deployment Pipeline

on:
  push:
    branches: [ '**' ]  # Any branch triggers build
  pull_request:
    branches: [ main, release/** ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - DEV
          - SIT
          - UAT
          - PROD
      branch:
        description: 'Branch to deploy (for DEV) or release branch (for SIT/UAT/PROD)'
        required: true
        type: string
        default: 'main'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: finance-tracker
  JAVA_VERSION: '21'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Run unit tests
      run: mvn test

    - name: Generate test coverage report
      run: mvn jacoco:report

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: '**/target/site/jacoco/'

  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build and push Docker images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        LATEST_TAG: latest
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        # Build API Gateway
        docker buildx build \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$BRANCH_NAME \
          -f api-gateway/Dockerfile \
          --push \
          .
        
        # Build Ingestion Service
        docker buildx build \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$BRANCH_NAME \
          -f ingestion-service/Dockerfile \
          --push \
          .
        
        # Build Parsing Service
        docker buildx build \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$BRANCH_NAME \
          -f parsing-service/Dockerfile \
          --push \
          .
        
        # Build Categorization Service
        docker buildx build \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$BRANCH_NAME \
          -f categorization-service/Dockerfile \
          --push \
          .
        
        # Build Analytics Service
        docker buildx build \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$BRANCH_NAME \
          -f analytics-service/Dockerfile \
          --push \
          .
        
        # Move cache
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: |
          target/
          pom.xml

  # DEV Environment - Any branch can be deployed automatically or manually
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'DEV')
    environment:
      name: DEV
      url: http://${{ secrets.DEV_EC2_HOST }}:8080
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Deploy to DEV EC2
      env:
        PRIVATE_KEY: ${{ secrets.DEV_EC2_PRIVATE_KEY }}
        EC2_HOST: ${{ secrets.DEV_EC2_HOST }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
        JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME: ${{ secrets.DEV_S3_BUCKET_NAME }}
        EC2_PUBLIC_IP: ${{ secrets.DEV_EC2_PUBLIC_IP }}
        IMAGE_TAG: ${{ github.sha }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        # Deploy to DEV EC2
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$EC2_HOST << 'ENDSSH'
          # Create directory if it doesn't exist
          mkdir -p /home/ubuntu/finance-tracker
          cd /home/ubuntu/finance-tracker
          
          # Login to ECR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull images for this branch
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG
          
          # Tag as branch-specific
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$BRANCH_NAME
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$BRANCH_NAME
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$BRANCH_NAME
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$BRANCH_NAME
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$BRANCH_NAME
          
          # Create environment file
          cat > .env << ENVFILE
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          AWS_REGION=us-east-1
          S3_BUCKET_NAME=$S3_BUCKET_NAME
          EC2_PUBLIC_IP=$EC2_PUBLIC_IP
          ECR_REGISTRY=$ECR_REGISTRY
          ECR_REPOSITORY=$ECR_REPOSITORY
          ENVIRONMENT=DEV
          BRANCH=$BRANCH_NAME
          ENVFILE
          
          # Stop existing containers for this branch
          docker-compose -p finance-$BRANCH_NAME down || true
          
          # Start new containers for this branch
          docker-compose -p finance-$BRANCH_NAME up -d
          
          # Wait for services to be healthy
          sleep 60
          
          # Check service status
          docker-compose -p finance-$BRANCH_NAME ps
        ENDSSH

    - name: Run health checks
      env:
        EC2_HOST: ${{ secrets.DEV_EC2_HOST }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "Waiting for services to start..."
        sleep 60
        
        # Check API Gateway health
        echo "Checking API Gateway health..."
        curl -f http://$EC2_HOST:8080/actuator/health || exit 1
        
        # Check Ingestion Service health
        echo "Checking Ingestion Service health..."
        curl -f http://$EC2_HOST:8081/actuator/health || exit 1
        
        # Check Analytics Service health
        echo "Checking Analytics Service health..."
        curl -f http://$EC2_HOST:8084/actuator/health || exit 1
        
        echo "All health checks passed!"

    - name: Notify deployment status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}';
          const branch = '${{ github.ref_name }}';
          const message = `DEV Deployment ${status === 'success' ? 'completed successfully' : 'failed'} for branch ${branch} (commit ${{ github.sha }})`;
          console.log(message);

  # SIT Environment - Only release branches, requires DEV deployment + manual approval
  deploy-sit:
    name: Deploy to SIT
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'SIT' && startsWith(github.event.inputs.branch, 'release/')
    environment:
      name: SIT
      url: http://${{ secrets.SIT_EC2_HOST }}:8080
    
    steps:
    - name: Verify release branch
      run: |
        BRANCH="${{ github.event.inputs.branch }}"
        if [[ ! "$BRANCH" =~ ^release/ ]]; then
          echo "ERROR: Only release branches can be deployed to SIT"
          echo "Branch must start with 'release/'"
          exit 1
        fi
        echo "Branch $BRANCH is a valid release branch"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Deploy to SIT EC2
      env:
        PRIVATE_KEY: ${{ secrets.SIT_EC2_PRIVATE_KEY }}
        EC2_HOST: ${{ secrets.SIT_EC2_HOST }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        POSTGRES_PASSWORD: ${{ secrets.SIT_POSTGRES_PASSWORD }}
        JWT_SECRET: ${{ secrets.SIT_JWT_SECRET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME: ${{ secrets.SIT_S3_BUCKET_NAME }}
        EC2_PUBLIC_IP: ${{ secrets.SIT_EC2_PUBLIC_IP }}
        IMAGE_TAG: ${{ github.sha }}
        BRANCH_NAME: ${{ github.event.inputs.branch }}
      run: |
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        # Deploy to SIT EC2
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$EC2_HOST << 'ENDSSH'
          # Create directory if it doesn't exist
          mkdir -p /home/ubuntu/finance-tracker
          cd /home/ubuntu/finance-tracker
          
          # Login to ECR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull images for this release branch
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG
          
          # Tag as latest for SIT
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:parsing-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:categorization-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:analytics-latest
          
          # Create environment file
          cat > .env << ENVFILE
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          AWS_REGION=us-east-1
          S3_BUCKET_NAME=$S3_BUCKET_NAME
          EC2_PUBLIC_IP=$EC2_PUBLIC_IP
          ECR_REGISTRY=$ECR_REGISTRY
          ECR_REPOSITORY=$ECR_REPOSITORY
          ENVIRONMENT=SIT
          RELEASE_BRANCH=$BRANCH_NAME
          ENVFILE
          
          # Stop existing containers
          docker-compose down || true
          
          # Start new containers
          docker-compose up -d
          
          # Wait for services to be healthy
          sleep 60
          
          # Check service status
          docker-compose ps
        ENDSSH

    - name: Run health checks
      env:
        EC2_HOST: ${{ secrets.SIT_EC2_HOST }}
      run: |
        echo "Waiting for services to start..."
        sleep 60
        
        # Check API Gateway health
        echo "Checking API Gateway health..."
        curl -f http://$EC2_HOST:8080/actuator/health || exit 1
        
        # Check Ingestion Service health
        echo "Checking Ingestion Service health..."
        curl -f http://$EC2_HOST:8081/actuator/health || exit 1
        
        # Check Analytics Service health
        echo "Checking Analytics Service health..."
        curl -f http://$EC2_HOST:8084/actuator/health || exit 1
        
        echo "All health checks passed!"

    - name: Notify deployment status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}';
          const branch = '${{ github.event.inputs.branch }}';
          const message = `SIT Deployment ${status === 'success' ? 'completed successfully' : 'failed'} for release branch ${branch} (commit ${{ github.sha }})`;
          console.log(message);

  # UAT Environment - Only release branches, requires SIT deployment + manual approval
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: [build, deploy-sit]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'UAT' && startsWith(github.event.inputs.branch, 'release/')
    environment:
      name: UAT
      url: http://${{ secrets.UAT_EC2_HOST }}:8080
    
    steps:
    - name: Verify release branch
      run: |
        BRANCH="${{ github.event.inputs.branch }}"
        if [[ ! "$BRANCH" =~ ^release/ ]]; then
          echo "ERROR: Only release branches can be deployed to UAT"
          echo "Branch must start with 'release/'"
          exit 1
        fi
        echo "Branch $BRANCH is a valid release branch"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Deploy to UAT EC2
      env:
        PRIVATE_KEY: ${{ secrets.UAT_EC2_PRIVATE_KEY }}
        EC2_HOST: ${{ secrets.UAT_EC2_HOST }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        POSTGRES_PASSWORD: ${{ secrets.UAT_POSTGRES_PASSWORD }}
        JWT_SECRET: ${{ secrets.UAT_JWT_SECRET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME: ${{ secrets.UAT_S3_BUCKET_NAME }}
        EC2_PUBLIC_IP: ${{ secrets.UAT_EC2_PUBLIC_IP }}
        IMAGE_TAG: ${{ github.sha }}
        BRANCH_NAME: ${{ github.event.inputs.branch }}
      run: |
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        # Deploy to UAT EC2
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$EC2_HOST << 'ENDSSH'
          # Create directory if it doesn't exist
          mkdir -p /home/ubuntu/finance-tracker
          cd /home/ubuntu/finance-tracker
          
          # Login to ECR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull images for this release branch
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG
          
          # Tag as latest for UAT
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:parsing-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:categorization-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:analytics-latest
          
          # Create environment file
          cat > .env << ENVFILE
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          AWS_REGION=us-east-1
          S3_BUCKET_NAME=$S3_BUCKET_NAME
          EC2_PUBLIC_IP=$EC2_PUBLIC_IP
          ECR_REGISTRY=$ECR_REGISTRY
          ECR_REPOSITORY=$ECR_REPOSITORY
          ENVIRONMENT=UAT
          RELEASE_BRANCH=$BRANCH_NAME
          ENVFILE
          
          # Stop existing containers
          docker-compose down || true
          
          # Start new containers
          docker-compose up -d
          
          # Wait for services to be healthy
          sleep 60
          
          # Check service status
          docker-compose ps
        ENDSSH

    - name: Run health checks
      env:
        EC2_HOST: ${{ secrets.UAT_EC2_HOST }}
      run: |
        echo "Waiting for services to start..."
        sleep 60
        
        # Check API Gateway health
        echo "Checking API Gateway health..."
        curl -f http://$EC2_HOST:8080/actuator/health || exit 1
        
        # Check Ingestion Service health
        echo "Checking Ingestion Service health..."
        curl -f http://$EC2_HOST:8081/actuator/health || exit 1
        
        # Check Analytics Service health
        echo "Checking Analytics Service health..."
        curl -f http://$EC2_HOST:8084/actuator/health || exit 1
        
        echo "All health checks passed!"

    - name: Notify deployment status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}';
          const branch = '${{ github.event.inputs.branch }}';
          const message = `UAT Deployment ${status === 'success' ? 'completed successfully' : 'failed'} for release branch ${branch} (commit ${{ github.sha }})`;
          console.log(message);

  # PROD Environment - Only release branches, requires UAT deployment + manual approval
  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: [build, deploy-uat]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'PROD' && startsWith(github.event.inputs.branch, 'release/')
    environment:
      name: PROD
      url: http://${{ secrets.PROD_EC2_HOST }}:8080
    
    steps:
    - name: Verify release branch
      run: |
        BRANCH="${{ github.event.inputs.branch }}"
        if [[ ! "$BRANCH" =~ ^release/ ]]; then
          echo "ERROR: Only release branches can be deployed to PROD"
          echo "Branch must start with 'release/'"
          exit 1
        fi
        echo "Branch $BRANCH is a valid release branch"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Deploy to PROD EC2
      env:
        PRIVATE_KEY: ${{ secrets.PROD_EC2_PRIVATE_KEY }}
        EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
        JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        S3_BUCKET_NAME: ${{ secrets.PROD_S3_BUCKET_NAME }}
        EC2_PUBLIC_IP: ${{ secrets.PROD_EC2_PUBLIC_IP }}
        IMAGE_TAG: ${{ github.sha }}
        BRANCH_NAME: ${{ github.event.inputs.branch }}
      run: |
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        # Deploy to PROD EC2
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$EC2_HOST << 'ENDSSH'
          # Create directory if it doesn't exist
          mkdir -p /home/ubuntu/finance-tracker
          cd /home/ubuntu/finance-tracker
          
          # Login to ECR
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull images for this release branch
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG
          docker pull $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG
          
          # Tag as latest for PROD
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:api-gateway-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:ingestion-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:parsing-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:parsing-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:categorization-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:categorization-latest
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:analytics-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:analytics-latest
          
          # Create environment file
          cat > .env << ENVFILE
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          AWS_REGION=us-east-1
          S3_BUCKET_NAME=$S3_BUCKET_NAME
          EC2_PUBLIC_IP=$EC2_PUBLIC_IP
          ECR_REGISTRY=$ECR_REGISTRY
          ECR_REPOSITORY=$ECR_REPOSITORY
          ENVIRONMENT=PROD
          RELEASE_BRANCH=$BRANCH_NAME
          ENVFILE
          
          # Stop existing containers
          docker-compose down || true
          
          # Start new containers
          docker-compose up -d
          
          # Wait for services to be healthy
          sleep 60
          
          # Check service status
          docker-compose ps
        ENDSSH

    - name: Run health checks
      env:
        EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
      run: |
        echo "Waiting for services to start..."
        sleep 60
        
        # Check API Gateway health
        echo "Checking API Gateway health..."
        curl -f http://$EC2_HOST:8080/actuator/health || exit 1
        
        # Check Ingestion Service health
        echo "Checking Ingestion Service health..."
        curl -f http://$EC2_HOST:8081/actuator/health || exit 1
        
        # Check Analytics Service health
        echo "Checking Analytics Service health..."
        curl -f http://$EC2_HOST:8084/actuator/health || exit 1
        
        echo "All health checks passed!"

    - name: Notify deployment status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = '${{ job.status }}';
          const branch = '${{ github.event.inputs.branch }}';
          const message = `PROD Deployment ${status === 'success' ? 'completed successfully' : 'failed'} for release branch ${branch} (commit ${{ github.sha }})`;
          console.log(message);

  # Rollback Jobs (Environment-specific)
  rollback-dev:
    name: Rollback DEV Deployment
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: failure()
    environment:
      name: DEV
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.before }}

    - name: Rollback DEV to previous version
      env:
        PRIVATE_KEY: ${{ secrets.DEV_EC2_PRIVATE_KEY }}
        EC2_HOST: ${{ secrets.DEV_EC2_HOST }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$EC2_HOST << 'ENDSSH'
          cd /home/ubuntu/finance-tracker
          git checkout ${{ github.event.before }}
          docker-compose -p finance-$BRANCH_NAME down
          docker-compose -p finance-$BRANCH_NAME up -d
        ENDSSH

  rollback-sit:
    name: Rollback SIT Deployment
