# application.yml - Categorization Service

server:
  port: 8083   # 8081=ingestion, 8082=parsing, 8083=categorization, 8084=analytics, 8080=gateway

spring:
  application:
    name: categorization-service

  threads:
    virtual:
      enabled: true   # see parsing-service's rationale - LLM calls are I/O-bound

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financetracker}
    username: ${DB_USER:finance_app}
    password: ${DB_PASS:finance_app_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    table: flyway_schema_history_categorization

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: categorization-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

finance-tracker:
  kafka:
    topics:
      transaction-parsed: transaction.parsed
      transaction-parsed-dlt: transaction.parsed.DLT

  llm:
    chat:
      base-url: ${LLM_CHAT_BASE_URL:http://localhost:11434}
      model: ${LLM_CHAT_MODEL:llama3.1}
      api-key: ${LLM_CHAT_API_KEY:}
      timeout-seconds: 30

  # The color the (future) dashboard uses to highlight a transaction
  # whose category is PENDING_REVIEW - defined here, server-side, so the
  # color convention lives in one place rather than being hardcoded
  # separately in whatever frontend eventually consumes this API.
  ui:
    pending-review-highlight-color: "#FF4F79"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.financetracker: DEBUG
